services:
  - type: web
    name: aegisbom-api
    env: node
    plan: standard
    buildCommand: npm install && npm run build
    startCommand: npm run start --workspace=@lord-penguin/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: aegisbom-db
          property: connectionString
      - key: PAYPAL_ENVIRONMENT
        value: SANDBOX
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: KERNEL_API_KEY
        sync: false

databases:
  - name: aegisbom-db
    databaseName: aegisbom
    user: postgres
    plan: standard
